company_name: Awesome RMM
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome RMM
initial_prompt: >-
  A curated directory of RMM, PSA and MSP tools for managed service providers
  and IT teams. Include products such as NinjaOne, ConnectWise Automate, Datto
  RMM, Atera, N-able N-central, Syncro, SuperOps, Pulseway, Action1, Level,
  Tactical RMM, MeshCentral, plus other notable commercial and open-source
  options. Categories: RMM Platforms, PSA (Professional Services Automation),
  Remote Access, Backup for MSPs, Security for MSPs, Open Source. For every item
  capture the official website, a short factual description, pricing model
  (free, freemium, paid, open source), deployment (cloud or self-hosted), key
  features and integrations.


  Initial categories: RMM Platforms; PSA (Professional Services Automation);
  Remote Access; Backup for MSPs; Security for MSPs; Open Source.

  Target keywords: rmm software, msp tools, remote monitoring and management,
  psa software.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://www.softwaresuggest.com/remote-monitoring-management-software

  - https://www.softwaresuggest.com/msp-software

  - https://raw.githubusercontent.com/guardzcom/awesome-msp/HEAD/README.md

  - https://awesome-selfhosted.net/tags/remote-access.html

  - https://github.com/ripienaar/free-for-dev#remote-desktop-tools

  - https://en.wikipedia.org/wiki/Comparison_of_remote_desktop_software

  - https://github.com/topics/rmm


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-rmm-website
company_website: https://rmm.ever.works
