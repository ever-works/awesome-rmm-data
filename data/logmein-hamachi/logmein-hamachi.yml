markdown: >-
  ## Overview


  LogMeIn Hamachi is a hosted VPN service that enables secure extension of
  LAN-like networks to distributed teams.


  ## Features


  - Hosted VPN service

  - Securely extend LAN-like networks

  - Free plan: unlimited networks with up to 5 people

  - Distributed team support


  ## Pricing


  Free plan available with unlimited networks (up to 5 people per network). Paid
  plans available for larger teams.
