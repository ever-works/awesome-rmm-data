markdown: >-
  ## Overview


  Basecamp is a project management and team communication tool featuring to-do
  lists, milestone management, messaging, file sharing, and time tracking.


  ## Features


  - To-do lists

  - Milestone management

  - Forum-like messaging

  - File sharing

  - Time tracking

  - Free plan: 3 projects, 20 users, 1GB storage


  ## Pricing


  Free plan supports up to 3 projects, 20 users, and 1GB storage. Paid plans
  available.
