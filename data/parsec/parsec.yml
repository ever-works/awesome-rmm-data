markdown: >-
  ## Overview


  Parsec is a remote desktop application designed for low-latency remote access,
  well suited to gaming and remote work scenarios.


  ## Features


  - Installation on an unlimited number of devices for personal use

  - Up to 20 simultaneous connections to a single device

  - Optimized for low-latency streaming and gaming

  - Remote desktop access and control


  ## Pricing


  Free for personal use.
