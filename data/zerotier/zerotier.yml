markdown: >-
  ## Overview


  ZeroTier is a free and open-source managed virtual Ethernet service that
  creates end-to-end encrypted networks between devices.


  ## Features


  - FOSS managed virtual Ethernet as a service

  - Unlimited end-to-end encrypted networks

  - Free plan: up to 25 clients

  - Clients for desktop, mobile, and NAS

  - Web interface for custom routing rules

  - Client node approval on private networks


  ## Pricing


  Free plan includes unlimited networks with up to 25 clients. Paid plans
  available for larger deployments.
