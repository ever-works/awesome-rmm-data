markdown: >-
  ## Overview


  Jira is an advanced software development project management tool used in many
  corporate environments for issue tracking and agile project management.


  ## Features


  - Software development project management

  - Issue tracking

  - Agile boards (Scrum, Kanban)

  - Free plan for up to 10 users

  - Corporate environment support


  ## Pricing


  Free plan for up to 10 users. Paid plans available for larger teams.
