markdown: >-
  ## Overview


  YouTrack is an issue tracking and agile project management tool from
  JetBrains, with free hosting for FOSS and small private projects.


  ## Features


  - Issue tracking

  - Agile boards

  - Time tracking

  - Free hosted YouTrack (InCloud)

  - Free for FOSS projects and private projects (up to 3 users)


  ## Pricing


  Free for FOSS projects and up to 3 users for private projects. Paid plans for
  larger teams.
