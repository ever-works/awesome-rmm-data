markdown: >-
  ## Overview


  Onloc is a location tracking and sharing platform that enables real-time
  location sharing and remote control/locking of stolen or lost phones.


  ## Features


  - Real-time location tracking

  - Location sharing

  - Remote phone control and locking

  - Anti-theft features

  - Docker support

  - Mobile clients


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via Docker.
