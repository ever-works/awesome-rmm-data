markdown: >-
  ## Overview


  Engity's Bifröst is a highly customizable SSH server that supports multiple
  user authorization methods and flexible session execution options.


  ## Features


  - Highly customizable SSH server

  - Multiple user authorization methods

  - Flexible session execution options

  - Written in Go

  - Docker support


  ## Pricing


  Free and open-source under the Apache-2.0 license.


  ## Deployment


  Self-hosted via Docker.
