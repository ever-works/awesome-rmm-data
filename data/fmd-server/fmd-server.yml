markdown: >-
  ## Overview


  FMD Server is a server component that communicates with the FMD (Find My
  Device) Android app to locate and control devices remotely.


  ## Features


  - Communication with FMD Android app

  - Device location tracking

  - Remote device control

  - Written in Go

  - Docker support


  ## Pricing


  Free and open-source under the GPL-3.0 license.


  ## Deployment


  Self-hosted via Docker.
