markdown: >-
  ## Overview


  Jamf is a device management platform focused on Apple devices, supporting
  iPads, iPhones, and Macs for enterprise and education use cases.


  ## Key Features


  - Device management for iPad, iPhone, and Mac

  - MDM enrollment and configuration

  - Apple device fleet management


  ## Pricing


  A free tier is available for up to three devices. Paid plans scale to larger
  device fleets.


  ## Deployment


  Cloud-hosted SaaS platform.
