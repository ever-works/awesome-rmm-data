markdown: >-
  ## Overview


  Getscreen.me is a browser-based remote desktop and remote support solution.


  ## Features


  - Free for up to 2 devices

  - No limits on the number or duration of sessions

  - Browser-based remote access (no client installation required on the remote
  side)

  - Remote support capabilities


  ## Pricing


  Free for up to 2 devices. Paid plans available for additional devices and
  commercial use.
