name: x11vnc
description: x11vnc is an open source VNC server for X11 that allows remote
  users to view and interact with an existing X11 desktop session. Unlike other
  VNC servers that create new virtual sessions, x11vnc shares the current real X
  display. It is designed for Linux and Unix-like systems.
