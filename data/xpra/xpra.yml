name: xpra
description: xpra is an open source tool that allows users to run X applications
  on a remote host and display them on a local machine, similar to GNU Screen
  for X11. It supports persistent sessions that survive disconnections,
  application forwarding, and seamless window integration. The software is
  designed for Linux and Unix-like systems.
