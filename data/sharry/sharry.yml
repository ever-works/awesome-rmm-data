markdown: >-
  ## Overview


  Sharry is a browser-based screen sharing tool that requires no downloads or
  installations. It is useful for pair programming, presentations, or remote
  support scenarios.


  ## Features


  - Screen sharing via browser with no downloads or installs

  - No account required for free tier

  - 5-minute session limit on free tier

  - 1 viewer limit on free tier

  - Suitable for pair programming, presentations, and remote support


  ## Pricing


  Free tier available with limitations (5-minute sessions, 1 viewer, no account
  required). Additional details on paid plans available at the official website.
