markdown: >-
  ## Overview


  Kitemaker is a product development collaboration tool that integrates with
  Slack, Discord, Figma, and GitHub.


  ## Features


  - Product development process collaboration

  - Work tracking across Slack, Discord, Figma, GitHub

  - Unlimited users, unlimited spaces

  - Free plan: up to 250 work items


  ## Pricing


  Free plan available up to 250 work items. Paid plans for larger teams.
