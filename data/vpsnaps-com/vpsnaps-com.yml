markdown: >-
  ## Overview


  VPS Snaps is an automated server backup and snapshots service spanning
  multiple cloud providers.


  ## Features


  - Automated server backups and snapshots across 8 cloud providers

  - Stores backups in your own bucket or Google Drive

  - Free plan: 1 server, daily backups, no credit card required


  ## Pricing


  Freemium: a free plan covering 1 server with daily backups (no credit card),
  with paid tiers for additional servers and features.
