markdown: >-
  ## Overview


  Puter is a web-based operating system designed to be feature-rich,
  exceptionally fast, and highly extensible, accessible through a web browser.


  ## Features


  - Web-based operating system

  - Feature-rich and fast

  - Highly extensible

  - Browser-based access

  - Written in Node.js

  - Docker support


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via Docker.
