name: TigerVNC
description: TigerVNC is a high-performance VNC (Virtual Network Computing)
  implementation for remote desktop access. It is an open source project derived
  from TightVNC and TurboVNC code, optimized for performance across LAN and WAN
  connections. The software is cross-platform and supports Windows, Linux, and
  macOS.
