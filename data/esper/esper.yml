markdown: >-
  ## Overview


  Esper is a mobile device management (MDM) and mobile application management
  (MAM) platform built for Android devices, combining device management with
  DevOps workflows.


  ## Key Features


  - Android device provisioning and configuration

  - Mobile application management (MAM)

  - Device fleet management and monitoring

  - DevOps-style device operations


  ## Pricing


  The free plan includes support for up to 100 devices, one user license, and 25
  MB of application storage. Paid plans are available for larger deployments.


  ## Deployment


  Cloud-hosted SaaS platform.
