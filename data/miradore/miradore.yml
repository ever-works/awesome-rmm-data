markdown: >-
  ## Overview


  Miradore is a device management service for keeping device fleets up to date
  and secure, suitable for IT teams managing mixed device environments.


  ## Key Features


  - Device fleet inventory and monitoring

  - Device security and compliance

  - Unlimited devices on the free plan

  - Basic features included in the free tier


  ## Pricing


  Freemium model: the free plan supports an unlimited number of devices with
  basic features. Paid plans add advanced capabilities.


  ## Deployment


  Cloud-hosted SaaS platform.
