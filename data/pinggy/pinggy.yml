markdown: >-
  ## Overview


  Pinggy provides public URLs for localhost with a single command, requiring no
  downloads. Supports HTTPS, TCP, and TLS tunnels.


  ## Features


  - Public URLs for localhost via single command

  - No downloads required

  - HTTPS / TCP / TLS tunnels

  - Free plan: 60-minute tunnel lifetime


  ## Pricing


  Free plan available with 60-minute tunnel lifetime. Paid plans for extended
  features.
