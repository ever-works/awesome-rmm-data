markdown: >-
  ## Overview


  Filebase is S3-compatible object storage powered by blockchain, providing
  geo-redundant storage across decentralized networks including IPFS, Filecoin,
  and Storj.


  ## Features


  - S3-compatible API for integration with backup and storage tools

  - Geo-redundant storage across IPFS, Filecoin, and Storj

  - 5 GB free storage for unlimited duration

  - Built-in redundancy and high availability

  - Suitable for backup, archival, and content distribution


  ## Pricing Model


  Free tier includes 5 GB of storage with unlimited duration. Additional storage
  and bandwidth are available on paid plans.


  ## Deployment


  Cloud-hosted service.
