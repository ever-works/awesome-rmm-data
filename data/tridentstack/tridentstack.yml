markdown: >-
  ## Overview


  TridentStack is an endpoint management platform focused on patch,
  vulnerability, and compliance management across Windows, macOS, and Linux.


  ## Key Features


  - Patch management for Windows, macOS, and Linux endpoints

  - Vulnerability management

  - Compliance management

  - Endpoint visibility and reporting


  ## Pricing


  Free forever for up to 200 endpoints, with every feature included and no
  credit card required.


  ## Deployment


  Cloud-hosted SaaS platform.
