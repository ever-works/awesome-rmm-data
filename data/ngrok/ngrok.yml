markdown: >-
  ## Overview


  ngrok is a service that exposes locally running servers over a tunnel to a
  public URL, commonly used for webhook development, testing APIs, and sharing
  local development environments.


  ## Features


  - Expose localhost servers over public tunnel

  - Public URL for local development

  - Webhook testing and debugging

  - API development and testing


  ## Pricing


  Free tier available. Paid plans for custom domains, more concurrent
  connections, and advanced features.
