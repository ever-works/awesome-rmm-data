markdown: >-
  ## Overview


  SimpleBackups is a backup automation service for servers and databases,
  storing backups directly into cloud storage providers.


  ## Features


  - Backup automation for servers and databases

  - Supports MySQL, PostgreSQL, and MongoDB

  - Stores backups into cloud storage providers including AWS, DigitalOcean, and
  Backblaze

  - Free plan includes 1 backup


  ## Pricing


  Freemium: a free plan for 1 backup, with paid tiers for additional backups and
  features.
