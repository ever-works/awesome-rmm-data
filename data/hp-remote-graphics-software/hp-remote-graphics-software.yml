name: HP Remote Graphics Software
description: HP Remote Graphics Software (RGS) is a remote desktop solution for
  high-performance workstations, enabling users to remotely access
  graphics-intensive applications. It supports remote access to HP Z
  Workstations and is designed for professionals working with 3D modeling, CAD,
  and other visually demanding workloads. The software is developed by Hewlett
  Packard.
