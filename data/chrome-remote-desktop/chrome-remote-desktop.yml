markdown: >-
  ## Overview


  Chrome Remote Desktop is a free remote desktop app developed by Google that
  enables users to remotely access another computer through the Chrome browser
  or a Chromebook. It requires a Google account for authentication.


  ## Features


  - Free remote desktop access with practically no limit on the number of
  devices

  - Access through Chrome browser or Chromebook

  - Requires Google account

  - No time limit on free usage


  ## Pricing


  Free.
