markdown: >-
  ## Overview


  Tailscale is a zero-config VPN that uses the open-source WireGuard protocol to
  create secure private networks between devices.


  ## Features


  - Zero-configuration setup

  - WireGuard protocol

  - Cross-platform support: macOS, iOS, Windows, Linux, Android

  - Free plan for personal use

  - 100 devices and 3 users on free plan


  ## Pricing


  Free for personal use (up to 100 devices, 3 users). Paid plans available for
  teams and commercial use.
