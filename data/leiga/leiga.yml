markdown: >-
  ## Overview


  Leiga is an AI-powered SaaS project management tool that automates project
  management.


  ## Features


  - AI-powered project management

  - Free for up to 10 users

  - 20 custom fields, 2GB storage

  - Video recording with AI (5 mins/video limit)

  - Automation runs (20/user/month)


  ## Pricing


  Free plan available with limits on users, storage, and AI features. Paid plans
  for larger teams.
