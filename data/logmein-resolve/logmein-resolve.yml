markdown: >-
  ## Overview


  LogMeIn Resolve is a remote support and remote access solution designed for IT
  support teams and managed service providers to troubleshoot and manage
  endpoints remotely.


  ## Features


  - Unattended remote access

  - On-demand remote support

  - Multi-platform support (Windows, macOS, Linux, iOS, Android)

  - Session diagnostics and management

  - File transfer

  - Remote reboot and reconnect

  - Screen sharing and remote control


  ## Pricing


  Paid subscription service with tiered pricing based on number of technicians
  and devices.
