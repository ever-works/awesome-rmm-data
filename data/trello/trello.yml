markdown: >-
  ## Overview


  Trello is a board-based project management tool using Kanban-style boards for
  organizing tasks and projects.


  ## Features


  - Board-based project management

  - Kanban-style boards

  - Unlimited personal boards

  - 10 team boards on free plan

  - Collaboration features


  ## Pricing


  Free plan includes unlimited personal boards and 10 team boards. Paid plans
  available for additional features.
