name: X2Go
description: X2Go is an open source remote desktop solution for Linux that uses
  NX technology to provide fast and secure access to remote desktops. It allows
  users to access graphical desktops and applications over low-bandwidth
  connections, with support for session suspension and resumption. The software
  includes both server and client components.
