markdown: >-
  ## Overview


  Netviewer Meet is a web conferencing and online meeting solution that enables
  screen sharing, remote support, and online collaboration.


  ## Features


  - Screen sharing and remote control

  - Online meetings and web conferencing

  - Remote support sessions

  - Mobile support (Android, iOS)

  - File transfer during sessions

  - Session recording


  ## Pricing


  Commercial software with free trial available.
