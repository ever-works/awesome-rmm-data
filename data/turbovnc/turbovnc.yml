name: TurboVNC
description: TurboVNC is a VNC implementation optimized for 3D graphics and
  video applications, derived from TigerVNC. It uses the VirtualGL library to
  provide hardware-accelerated 3D rendering over remote connections. The
  software is designed for engineers, scientists, and researchers working with
  visualization workloads.
